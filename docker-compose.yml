name: claude-sandbox
services:
  claude-proxy:
    build: ./proxy
    image: claude-proxy
    container_name: claude-proxy
    restart: unless-stopped
    networks: [claude-egress, claude-internal]
    volumes:
      - "./proxy/squid.conf:/etc/squid/squid.conf:ro"
  sbx:
    build: ./sandbox
    image: claude-sandbox
    depends_on: [claude-proxy]
    networks: [claude-internal]
    env_file:
      - ./secrets/claude.env
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    pids_limit: 512
    stdin_open: true
    tty: true
    volumes:
      - "claude-home:/home/dev"
      - "${PROJECT_DIR:?set PROJECT_DIR in .env}:/work"
volumes:
  claude-home:
    name: claude-home
networks:
  claude-egress:
    name: claude-egress
  claude-internal:
    name: claude-internal
    internal: true
