http_port 3128
visible_hostname claude-proxy

acl claude dstdomain api.anthropic.com platform.claude.com
acl github dstdomain api.github.com github.com codeload.github.com objects.githubusercontent.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT claude
http_access allow CONNECT github
http_access deny all

cache deny all
forwarded_for delete
via off
access_log /var/log/squid/access.log combined
cache_log /var/log/squid/cache.log
pid_filename none
